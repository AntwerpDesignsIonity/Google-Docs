name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Package application
        run: npm run package
      - name: Build installers
        run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: IONITY-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: ignore
